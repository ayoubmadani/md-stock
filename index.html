    <title>MdStore</title>
    <style>
      /* شاشة البداية: تظهر فوراً قبل تحميل الكود، ويخفيها التطبيق عندما يجهز (src/lib/splash.js) */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(60% 40% at 50% 42%, rgba(34, 197, 94, .16), transparent 70%), #09090b;
        font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; transition: opacity .3s ease; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash img { width: 120px; height: 120px; filter: drop-shadow(0 18px 40px rgba(34, 197, 94, .45)); }
      #splash p { margin: 0; color: #a1a1aa; font-size: 13px; font-weight: 600; }
      #splash .bar { position: relative; width: 120px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 6px; }
      #splash .bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #22c55e, #4ade80); animation: splash-bar 1.1s ease-in-out infinite alternate; }
      @keyframes splash-bar { from { left: 0; } to { left: 60%; } }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; left: 30%; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/icon-512.png" alt="" width="120" height="120" />
      <p>إدارة متجرك من هاتفك</p>
      <span class="bar"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
